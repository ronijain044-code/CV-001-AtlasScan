[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasscan"
version = "0.1.0"
description = "Professional Network Reconnaissance Toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
